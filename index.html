<html>
  <head>
    <link rel="stylesheet" href="stylesheet.css">
  </head>
  <body>
    <div id="inventoryPage">
      <button id="returnMainPage">X</button>
      <div id="statsSection">
        <button id="addHealthStat">+</button>
        <p id="healthStat">Health:0</p>
        <button id="addDamageStat">+</button>
        <p id="damageStat">Damage:0</p>
        <button id="addDefenseStat">+</button>
        <p id="defenseStat">Defenese:0</p>
        <p id="statPoints">Stat Points:0</p>
      </div>
      <div id="equipedSection">
        <p>Helmet:</p>
        <img src=' ' id="helmetSlot" />
        <p>Chestplate:</p>
        <img src=' ' id="chestplateSlot" />
        <p>Pants:</p>
        <img src=' ' id="pantSlot" />

        <img src=' ' id="bootSlot" />

        <img src=' ' id="weaponSlot" />

      <div id="inventorySpace"></div>

    <div id="mainPage">

      <button id="fightButton">Fight</button>

    </div>
    <div id="fightPage">
      <p id="fightPageEnemyHealth">En. Health</p>
      <img src=' ' id="fightPageEnemyImage" />
      <p id="fightPageHeroHealth">Health</p>
      <button id="attackButton">Attack</button>
      <button id="itemsButton">Items</button>
      <button id="runButton">Run</button>
      <p id="battleLog">It's time to d-d-d-d-d-duel</p>
    </div>
   <script src="main.js"></script>

</html>
